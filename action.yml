name: "Convert Quarto Fenced Divs"
description: "Converts Quarto fenced divs (:::{.callout-*}) in all .ipynb files to inline-styled HTML blocks for JupyterLab rendering."
author: "Simon Dürr"
inputs:
  python-version:
    description: "Version of Python to use"
    required: false
    default: "3.10"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Run convert_fenced_divs script
      shell: bash
      run: |
        echo "Converting Quarto fenced divs to HTML..."
        python ${GITHUB_ACTION_PATH}/convert_fenced_divs.py
